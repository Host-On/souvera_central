<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Logo Test</title>
<style>
  body { margin:0; font-family: sans-serif; display:flex; }
  .panel { flex:1; padding:40px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .light { background:#fff; color:#222; }
  .dark { background:#1e1e1e; color:#eee; }
  .blue { background:#0a2540; color:#eee; }
  img { width:160px; height:160px; }
  .small { width:48px; height:48px; }
</style></head>
<body>
  <div class="panel light"><h3>auf Weiss (normal)</h3><img src="/app.svg?v=cur"><img class="small" src="/app.svg?v=cur2"></div>
  <div class="panel dark"><h3>auf Dunkel</h3><img src="/app.svg?v=cur3"><img class="small" src="/app.svg?v=cur4"></div>
  <div class="panel blue"><h3>auf NC-Blau</h3><img src="/app.svg?v=cur5"><img class="small" src="/app.svg?v=cur6"></div>
</body>
</html>
